  - python=3.13
  - numpy=2.2
  - scipy=1.17
  - matplotlib
  - jupyterlab
  - r-base=4.5.2
  - r-irkernel
  - r-ggplot2
  - bioconductor-deseq2=1.50.2
  - bioconductor-limma
  - r-mass
